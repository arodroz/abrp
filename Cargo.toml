[workspace]
resolver = "2"
members = [
    "core/packs",
    "core/routing",
    "core/energy",
    "core/optimiser",
    "core/ffi",
    "pipeline",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

# UniFFI xcframework build profile (ADR 0004 point 6): size-optimized,
# fat LTO, single codegen unit, stripped, aborting panics (a panic across
# the FFI boundary is a bug, not something to unwind through). Does not
# touch `[profile.release]`, which the rest of the workspace still uses.
[profile.ffi-release]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
