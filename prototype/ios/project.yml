name: SliceProto
options:
  deploymentTarget:
    iOS: "17.0"

packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.29.0
  Planner:
    path: ../slice/Planner

targets:
  SliceProto:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SliceProto
    info:
      path: SliceProto/Info.plist
      properties:
        CFBundleDisplayName: SliceProto
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.anteras.slice-proto
        PRODUCT_NAME: SliceProto
        DEVELOPMENT_TEAM: 2V28CD5VJY
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: MapLibre
        product: MapLibre
      - package: Planner
        product: Planner
