name: Wayfinder
options:
  deploymentTarget:
    iOS: "17.0"

packages:
  PlannerKit:
    path: ../PlannerKit
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.29.0

targets:
  Wayfinder:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.anteras.wayfinder
        PRODUCT_NAME: Wayfinder
        DEVELOPMENT_TEAM: 2V28CD5VJY
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wayfinder
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Shows map data and charging stops for your route."
        INFOPLIST_KEY_CADisableMinimumFrameDurationOnPhone: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: PlannerKit
        product: PlannerKit
      - package: MapLibre
        product: MapLibre
