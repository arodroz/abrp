name: Wayfinder
options:
  deploymentTarget:
    iOS: "17.0"

packages:
  PlannerKit:
    path: ../PlannerKit
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.29.0

targets:
  Wayfinder:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    # Generated Info.plist (wayfinder #51): the INFOPLIST_KEY_UIBackgroundModes route doesn't
    # emit the array-valued UIBackgroundModes key at all, so this target uses xcodegen's `info:`
    # properties block instead -- verified with `plutil -p` on the built app's Info.plist.
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Wayfinder
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "Shows map data and charging stops for your route, and records your GPS trace during Trip Log capture. When a Trip Log is saved, an approximate (rounded) midpoint is sent to Open-Meteo to fetch the outside temperature."
        UIBackgroundModes:
          - location
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.anteras.wayfinder
        PRODUCT_NAME: Wayfinder
        DEVELOPMENT_TEAM: 2V28CD5VJY
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: PlannerKit
        product: PlannerKit
      - package: MapLibre
        product: MapLibre
