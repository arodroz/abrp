name: Wayfinder
options:
  deploymentTarget:
    iOS: "17.0"

packages:
  PlannerKit:
    path: ../PlannerKit
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.29.0

targets:
  Wayfinder:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      # Telemetry Profiles (wayfinder #79): bundled as a folder reference so
      # `Bundle.main.url(forResource:withExtension:subdirectory:)` can find them at
      # "profiles/<id>.tprof.json" -- see Ioniq5Profile.loadJson() (TelemetrySessionDialogue.swift).
      - path: ../../data/profiles
        name: profiles
        type: folder
        buildPhase: resources
    # Generated Info.plist (wayfinder #51): the INFOPLIST_KEY_UIBackgroundModes route doesn't
    # emit the array-valued UIBackgroundModes key at all, so this target uses xcodegen's `info:`
    # properties block instead -- verified with `plutil -p` on the built app's Info.plist.
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Wayfinder
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "Shows map data and charging stops for your route, and records your GPS trace during Trip Log capture. When a Trip Log is saved, an approximate (rounded) midpoint is sent to Open-Meteo to fetch the outside temperature."
        # OBDLink CX telemetry transport (wayfinder #78): only ever connects while Drive Mode is
        # active or a live/diagnostics surface is open, never while parked -- see
        # TelemetryLinkPolicy.swift. Deliberately no UIBackgroundModes bluetooth-central entry:
        # v1 is foreground-only, by design (the ticket forbids background scanning).
        NSBluetoothAlwaysUsageDescription: "Connects to an OBDLink CX adapter to read your car's live battery data over Bluetooth while driving or viewing diagnostics."
        UIBackgroundModes:
          - location
          - audio
        CADisableMinimumFrameDurationOnPhone: true
        # CarPlay display-only surface (wayfinder #70): a CPTemplateApplicationSceneSessionRole
        # scene needs UIApplicationSceneManifest to be picked up as an extra scene, alongside
        # the default WindowGroup scene above.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.anteras.wayfinder
        PRODUCT_NAME: Wayfinder
        DEVELOPMENT_TEAM: 2V28CD5VJY
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # CarPlay entitlement (wayfinder #70/#71), simulator-gated ON PURPOSE: Apple hasn't
        # granted the com.apple.developer.carplay-maps managed capability to this team yet, so
        # shipping it unconditionally would break Automatic code signing for real devices --
        # signing would fail trying to provision an entitlement the team isn't authorized for.
        # Restricting CODE_SIGN_ENTITLEMENTS to the simulator SDK lets CarPlay be exercised on
        # the Simulator now; #71 tracks dropping this [sdk=iphonesimulator*] qualifier once the
        # capability is granted.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Wayfinder.entitlements
    dependencies:
      - package: PlannerKit
        product: PlannerKit
      - package: MapLibre
        product: MapLibre

  WayfinderUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.anteras.wayfinder.uitests
        DEVELOPMENT_TEAM: 2V28CD5VJY
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Wayfinder

schemes:
  Wayfinder:
    build:
      targets:
        Wayfinder: all
        WayfinderUITests: [test]
    test:
      targets:
        - WayfinderUITests
    run:
      config: Debug
    archive:
      config: Release
