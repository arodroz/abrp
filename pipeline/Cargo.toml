[package]
name = "pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
packs = { path = "../core/packs" }
routing = { path = "../core/routing" }
csv = "1"
bytemuck = "1"
crc32fast = "1"
bincode = "1"
serde = { version = "1", features = ["derive"] }
osmpbf = "0.3"
flate2 = "1"
serde_json = "1"
sha2 = "0.10"
ureq = "2"
tiff = "0.9"

[dev-dependencies]
tempfile = "3"
